<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07070e" />
    <meta
      name="description"
      content="LeetCode leaderboard, profile analytics and head-to-head comparison for MCA students at NIT Warangal."
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="img-src 'self' data: https://assets.leetcode.com https://leetcode.com https://s3-us-west-1.amazonaws.com; font-src 'self' https://fonts.gstatic.com;"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500;600;700&family=Sora:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
      crossorigin="anonymous"
    />

    <title>LeetCode Among Us</title>
    <!--
      Apply the saved theme before React mounts so light-theme users do not see
      a dark first paint. Must stay in sync with ThemeContext (key: "theme").
    -->
    <script>
      try {
        var saved = localStorage.getItem('theme')
        var theme = saved === 'light' || saved === 'dark' ? saved : null
        if (!theme) {
          var prefersDark = window.matchMedia(
            '(prefers-color-scheme: dark)'
          ).matches
          theme = prefersDark ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = theme
      } catch (e) {
        /* storage unavailable: fall back to CSS default */
      }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
