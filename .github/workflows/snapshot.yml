name: Daily snapshot

# Records every roster user's solved counts and contest rating once a day and
# commits them to the `data` branch as history.json. LeetCode only exposes
# current totals, so this is the only source of "solved over time" and the
# weekly movers on the leaderboard. The API reads the file from
# raw.githubusercontent.com (see HISTORY_URL in server.ts).

on:
  schedule:
    # 19:00 UTC is 00:30 IST, just after the Indian day ends.
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    name: Snapshot roster
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check out the data branch (or start it)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$remote" data > /dev/null; then
            git clone --depth 1 --branch data "$remote" history
          else
            mkdir history
            git -C history init -b data
            git -C history remote add origin "$remote"
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'

      - name: Take snapshot
        run: node scripts/snapshot.mjs --out history/history.json

      - name: Commit and push
        working-directory: history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add history.json
          if git diff --cached --quiet; then
            echo 'No change since the last snapshot.'
            exit 0
          fi
          git commit -m "chore(data): snapshot $(date -u +%F)"
          git push origin data
